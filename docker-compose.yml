version: '3.8'

services:

  # ── 1. Backend FastAPI (Prédiction) ─────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    # SÉCURITÉ : On retire "ports:" pour éviter de contourner Nginx.
    # Les conteneurs se parlent en interne. Nginx le trouvera sur le port 80.
    expose:
      - "80"
    volumes:
      - ./data/users.json:/app/data/users.json
      - ./data/predictions_log.jsonl:/app/data/predictions_log.jsonl
      - ./models:/app/models

  # ── 2. Reverse proxy Nginx ─────────────────────────────────────────────────
  nginx:
    image: nginx:latest
    ports:
      - "8080:80" # Ton point d'entrée unique pour le web/frontend
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
      # CORRECTIF : On supprime "training-api" d'ici pour éviter que Docker ne bloque au démarrage.

  # ── 3. Interface Streamlit ─────────────────────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "8501:8501"
    environment:
      - PYTHONPATH=/app
    volumes:
      - ./models:/app/models:ro
    depends_on:
      - nginx

  # ── 4. MLflow Tracking Server ──────────────────────────────────────────────
  mlflow:
    image: ghcr.io/mlflow/mlflow:latest
    profiles:
      - training
    ports:
      - "5000:5000"
    volumes:
      - ./mlflow:/mlflow
    command: >
      mlflow server
        --host 0.0.0.0
        --port 5000
        --backend-store-uri /mlflow/mlruns
        --default-artifact-root /mlflow/artifacts

  # ── 5. Training API ────────────────────────────────────────────────────────
  training-api:
    build:
      context: .
      dockerfile: training/Dockerfile
    profiles:
      - training
    # SÉCURITÉ : Plus besoin d'exposer le port 8001 au public. Nginx s'en charge en interne sur le port 8000.
    expose:
      - "8000"
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./mlruns:/app/mlruns
    environment:
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - GIT_USER=auroremayo
      - GIT_TOKEN=${GIT_TOKEN}
    depends_on:
      - mlflow