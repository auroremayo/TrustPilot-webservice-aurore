events {}

http {
    # ── Rate limiting ─────────────────────────────────────────────────────────
    limit_req_zone $binary_remote_addr zone=api_limit:10m   rate=2r/s;
    limit_req_zone $binary_remote_addr zone=train_limit:10m rate=1r/m;

    server {
        listen 80;

        resolver 127.0.0.11 valid=30s ipv6=off;
        set $api_upstream      http://api:80;
        set $training_upstream http://training-api:8000;

        # ── Vérification quota/rôle (interne Nginx) ───────────────────────────
        location = /verify_admin {
            internal;
            proxy_pass             $api_upstream;
            proxy_pass_request_body off;
            proxy_set_header       Content-Length "";
            proxy_set_header       X-Original-URI $request_uri;
            proxy_set_header       X-API-Key $http_x_api_key;
        }

        # ── Route protégée : prédiction ───────────────────────────────────────
        location /predict {
            limit_req    zone=api_limit burst=5 nodelay;
            auth_request /verify_admin;

            proxy_pass       $api_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-API-Key $http_x_api_key;
        }

        # ── Route interne : rechargement du modèle ────────────────────────────
        # Accessible uniquement depuis le réseau Docker interne (Airflow)
        # Bloquée depuis l'extérieur
        location /internal/ {
            allow 172.16.0.0/12;
            allow 172.0.0.0/8;
            allow 127.0.0.1;
            deny all;

            proxy_pass       $api_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Internal-Secret $http_x_internal_secret;
        }

        # ── Route Training API ────────────────────────────────────────────────
        # Rate limit strict : 1 req/min, burst=5 pour tolérer les retries Airflow
        location /train/ {
            limit_req zone=train_limit burst=5 nodelay;

            proxy_pass       $training_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # ── Toutes les autres routes (backend) ────────────────────────────────
        location / {
            proxy_pass       $api_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-API-Key $http_x_api_key;
        }
    }
}